name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsecheck
          POSTGRES_PASSWORD: pulsecheck
          POSTGRES_DB: pulsecheck
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pulsecheck"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrations apply and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://pulsecheck:pulsecheck@localhost:5433/pulsecheck
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test
        run: python3 tools/smoke_test.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - run: docker compose down -v

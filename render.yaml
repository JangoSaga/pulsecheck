# Render Blueprint. Deploys only after the GitHub CI checks pass (autoDeployTrigger: checksPass).
# Workers need a paid plan (starter). Web, Postgres and Key Value can be free for learning use.
databases:
  - name: pulsecheck-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: pulsecheck
    user: pulsecheck

services:
  - type: keyvalue
    name: pulsecheck-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []   # private network only

  - type: web
    name: pulsecheck-api
    runtime: docker
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log"
    envVars: &common
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: {name: pulsecheck-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: pulsecheck-redis, property: connectionString}
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_PRIVATE_TARGETS
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: MAIL_FROM
        sync: false

  - type: worker
    name: pulsecheck-scheduler
    runtime: docker
    plan: starter
    autoDeployTrigger: checksPass
    dockerCommand: python -m app.workers.scheduler
    envVars: *common

  - type: worker
    name: pulsecheck-check-worker
    runtime: docker
    plan: starter
    autoDeployTrigger: checksPass
    dockerCommand: python -m app.workers.check_worker
    envVars: *common

  - type: worker
    name: pulsecheck-notification-worker
    runtime: docker
    plan: starter
    autoDeployTrigger: checksPass
    dockerCommand: python -m app.workers.notification_worker
    envVars: *common
